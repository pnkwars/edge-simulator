name: Bug report
description: Report a problem with Edge Simulator
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Clear description of the bug and what you expected.
      placeholder: Expected vs actual behavior…
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce it?
      placeholder: |
        1. Go to '…'
        2. Enter '…'
        3. Click '…'
        4. See error
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Kelly, Monte Carlo, Lab, Parlay, Risk, UI/Nav, CLI, Other]
    validations:
      required: false
  - type: input
    id: browser
    attributes:
      label: Browser / Python version
      placeholder: e.g. Chrome 128, Python 3.11
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste console errors or add screenshots.
      render: shell
    validations:
      required: false
